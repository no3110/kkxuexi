  <script>
  /* 部署自检兜底：如果部署包不完整/路径多套了一层，页面会卡在“正在加载”；6 秒后显示具体原因与自检入口。 */
  (function () {
    var errors = [];
    window.__LQ_ASSET_ERRORS__ = errors;
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
        errors.push({ tag: t.tagName, url: t.src || t.href || '' });
      }
    }, true);
    function showDiagnostics() {
      var boot = document.querySelector('.boot-loading');
      if (!boot) return;
      var box = document.createElement('div');
      box.id = 'deploy-diagnostics';
      box.style.cssText = 'max-width:660px;margin:36px auto;padding:20px 22px;border:1px solid #f0b90b;border-radius:12px;background:#141a22;color:#e6e8ea;font:14px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:left';
      var h = document.createElement('h2');
      h.textContent = '页面没有正常启动';
      h.style.cssText = 'margin:0 0 10px;color:#f0b90b;font-size:20px';
      box.appendChild(h);
      var p1 = document.createElement('p');
      p1.textContent = '常见原因：部署包不完整（assets 目录没有上传），或压缩包多套了一层文件夹（站点根目录必须直接有 index.html 和 assets/）。';
      box.appendChild(p1);
      var p2 = document.createElement('p');
      p2.textContent = '当前地址：' + location.href;
      box.appendChild(p2);
      if (errors.length) {
        var p3 = document.createElement('p');
        p3.textContent = '加载失败的资源（按 F12 在 Network/Console 也能看到）：';
        box.appendChild(p3);
        var ul = document.createElement('ul');
        ul.style.cssText = 'margin:6px 0 10px 18px;padding:0;word-break:break-all';
        errors.slice(0, 20).forEach(function (item) {
          var li = document.createElement('li');
          li.textContent = item.tag + ' ' + item.url;
          ul.appendChild(li);
        });
        box.appendChild(ul);
      } else {
        var p4 = document.createElement('p');
        p4.textContent = '没有捕获到资源错误，请按 F12 打开 Console 查看第一行报错。';
        box.appendChild(p4);
      }
      var p5 = document.createElement('p');
      p5.style.marginTop = '12px';
      var a = document.createElement('a');
      a.href = 'deploy-check.html';
      a.textContent = '→ 打开部署自检页（逐个检查文件是否上传成功）';
      a.style.cssText = 'color:#f0b90b;font-weight:600';
      p5.appendChild(a);
      box.appendChild(p5);
      boot.innerHTML = '';
      boot.appendChild(box);
      document.title = '加载失败 · 订单流学习系统';
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { setTimeout(showDiagnostics, 6000); });
    } else {
      setTimeout(showDiagnostics, 6000);
    }
  })();
  </script>
